[project]
name = "Axiom"
version = "0.1.0"
description = "A general purpose discord bot!"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "colored>=2.3.0",
    "coloredlogs>=15.0.1",
    "discord-py>=2.5.2",
    "openai>=1.82.0",
    "pynacl>=1.5.0",
    "python-dotenv>=1.1.0",
    "sqlalchemy>=2.0.41",
    "tinydb>=4.8.2",
]

[dependency-groups]
dev = [
    "ruff>=0.12.2",
]
